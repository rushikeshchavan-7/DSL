name: Build, Test & Deploy CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build & Test .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore platform/src/Platform.Api/Platform.Api.csproj

      - name: Build Backend
        run: dotnet build platform/src/Platform.Api/Platform.Api.csproj --configuration Release --no-restore

      - name: Run Backend Tests
        run: |
          if [ -d "platform/tests" ]; then
            dotnet test platform/src/Platform.Api/Platform.Api.csproj --no-build --verbosity normal
          fi

  build-frontend:
    name: Build & Test Angular Studio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd studio
          npm ci || npm install

      - name: Build Angular Studio
        run: |
          cd studio
          npm run build

  deploy-trigger:
    name: Trigger Live Deployment
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy (Backend)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
